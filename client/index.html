<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloak Town — hangout with friends</title>
    <meta name="theme-color" content="#3d2c1e" />
    <link rel="preload" as="image" href="/lobby/bg.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/lobby/logo.png" />
    <link rel="preload" as="image" href="/lobby/cloak.png" />
    <link rel="preload" as="image" href="/lobby/face.png" />
    <link rel="preload" as="image" href="/lobby/accent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,body,#root { margin:0; height:100%; background:#2b1f16; font-family: "Nunito", "Trebuchet MS", ui-rounded, system-ui, sans-serif; }
      /* game UI reads, not selects — inputs stay editable */
      #root { user-select: none; -webkit-user-select: none; }
      #root input, #root textarea, #root select { user-select: text; -webkit-user-select: text; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
